name: Publish to PyPI

# Fires only when a version tag (v0.1.1, v1.2.0, ...) is pushed.
# Tag your releases from main once the release PR is merged:
#   git tag v0.1.1 && git push origin v0.1.1
on:
  push:
    tags:
      - 'v*'

# Least-privilege at the workflow level; id-token:write is granted only to
# the publish job below, which is the one that actually needs it for OIDC.
permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify the tag was made from main
        run: |
          git fetch origin main --depth=1
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF is not on main. Refusing to publish."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Install package (editable) + dev dependencies
        run: |
          pip install -e ".[dev]"
          pip install pytest>=8.0

      - name: Run tests before publishing
        run: |
          set +e
          python -m pytest -v
          code=$?
          set -e
          if [ "$code" -eq 5 ]; then
            echo "::warning::No tests were collected. Publishing anyway, but you have no automated safety net on this release."
            exit 0
          fi
          exit "$code"

      - name: Build sdist + wheel
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for PyPI trusted publishing (OIDC) - no API token needed
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

